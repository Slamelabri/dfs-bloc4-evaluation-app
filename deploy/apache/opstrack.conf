# Vhost OpsTrack - production
# Installe par deploy/provision.sh dans /etc/apache2/sites-available/opstrack.conf
# Le bloc HTTPS (port 443) est genere et maintenu par certbot : opstrack-le-ssl.conf

<VirtualHost *:80>
    ServerName eval-dfs-p-tpl-20265-02.it-students.fr
    DocumentRoot /var/www/opstrack/public

    <Directory /var/www/opstrack/public>
        AllowOverride All
        Require all granted
        # Pas de listing de repertoire (durcissement)
        Options -Indexes +FollowSymLinks
    </Directory>

    # Le reste de l'arborescence applicative n'est jamais servi directement
    <Directory /var/www/opstrack>
        Require all denied
    </Directory>

    # Blocage explicite des fichiers sensibles
    <FilesMatch "^\.(env|git|gitignore|editorconfig)">
        Require all denied
    </FilesMatch>
    <FilesMatch "(composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|artisan)$">
        Require all denied
    </FilesMatch>

    # Microservice Next.js (dispatch-dashboard) sur 127.0.0.1:3000
    ProxyPreserveHost On
    ProxyPass /dispatch-dashboard http://127.0.0.1:3000/
    ProxyPassReverse /dispatch-dashboard http://127.0.0.1:3000/

    # En-tetes de securite
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By

    ErrorLog  ${APACHE_LOG_DIR}/opstrack_error.log
    CustomLog ${APACHE_LOG_DIR}/opstrack_access.log combined
</VirtualHost>
